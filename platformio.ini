; Two environments:
;   pio run -e xiao_esp32c3      build (and with -t upload: flash) the firmware
;   pio test -e native           run the core's unit tests on this computer
; The simulator is built separately with emscripten: see sim/build.sh.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
test_dir = test
default_envs = xiao_esp32c3

[env]
lib_deps = symlink://core
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
build_src_filter = -<*>
test_framework = unity
